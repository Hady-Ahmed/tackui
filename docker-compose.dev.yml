services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tackui}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0.1}
        NEXT_PUBLIC_UMAMI_URL: ${NEXT_PUBLIC_UMAMI_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tackui}
      PG_CONNECT_TIMEOUT: ${PG_CONNECT_TIMEOUT:-5000}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${APP_PORT:-3000}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ALLOW_PRIVATE_ENDPOINTS: ${ALLOW_PRIVATE_ENDPOINTS:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
      CONCURRENT_RUN_TIMEOUT_MS: ${CONCURRENT_RUN_TIMEOUT_MS:-}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:-}
      AGENTOS_BASE_URL: ${AGENTOS_BASE_URL:-http://agent-builder:7778}
      AGENTOS_JWT_SECRET: ${AGENTOS_JWT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      # Connecting to a local agent backend? Uncomment this + see README.
      # extra_hosts:
      #   - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Agent-builder service database — separate from the app's `db` on
  # purpose: the builder owns its catalog/state schema and its backups
  # have a different lifecycle. Not exposed to the host; the compose
  # network is the only way in.
  db-builder:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: ${AGENTOS_DB_PASSWORD:-agentos}
      POSTGRES_DB: agentos
    volumes:
      - pg_data_builder:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # The agent builder itself. No published ports — the app is the only
  # host-facing interface and reaches it over the compose network via
  # AGENTOS_BASE_URL above. JWT_SECRET must equal the app's
  # AGENTOS_JWT_SECRET (the dispatcher refuses to boot without one).
  agent-builder:
    build:
      context: ./agent-builder
    environment:
      DATABASE_URL: postgresql://agentos:${AGENTOS_DB_PASSWORD:-agentos}@db-builder:5432/agentos
      JWT_SECRET: ${AGENTOS_JWT_SECRET:-}
      AGENT_OS_HOST: 0.0.0.0
      AGENT_OS_PORT: "7778"
      SENTRY_DSN: ${AGENTOS_SENTRY_DSN:-}
      # Platform fallback keys. Under SaaS mode these stay unset (agents
      # bring their own credentials via the run gate); self-hosts may set
      # them in .env to give every agent platform-side keys.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      db-builder:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7778/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  pg_data:
  pg_data_builder:
