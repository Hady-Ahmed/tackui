version: 2
updates:
  # Keep npm dependencies current. Batches into weekly PRs to avoid
  # opening a PR per-version-per-package. Major versions still get their
  # own PR (Dependabot default) — review those carefully (Next.js,
  # better-auth, @copilotkit/* can all have breaking changes).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Group patch + minor updates together — these are low-risk.
      patch-and-minor:
        update-types:
          - patch
          - minor
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # Keep GitHub Actions versions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
      include: scope
