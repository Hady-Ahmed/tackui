name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on rapid pushes — saves runner minutes.
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          # Match the Dockerfile (node:24-alpine) — CI validates what ships.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          # Node 24 — the whole battery now matches the Dockerfile
          # (node:24-alpine). This job also can't go below it: the
          # real-Postgres test tier (testcontainers) needs node >= 22.22 via
          # its nested undici and crashed at import on 20 — which the
          # availability probe used to mask as "Docker down", silently
          # skipping the tier (#90).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test

  e2e:
    name: E2E smoke
    # Runs the real built app (standalone build) against a throwaway
    # Postgres container (plain `docker run` — Docker is preinstalled on
    # the runner) + the mock AG-UI agent. See e2e/web-server.mjs and
    # docs/e2e.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Build-time env is inline (never .env.local); values are dummies —
      # the runtime DB is the throwaway container web-server.mjs starts,
      # and runtime env is set there.
      - run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          AUTH_DISABLED: "true"
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright install --with-deps chromium
      # Skip the rebuild — the build above is the artifact under test.
      - run: npm run test:e2e:local

  image:
    name: Image boot (node:24-alpine)
    # Packaging gate (#96): the e2e job certifies the standalone server.js
    # under CI's Node 24 — Ubuntu/glibc. This job certifies the container
    # the PR actually ships, where musl libc can change native addon
    # resolution (sharp/libvips): build the image, boot it against a
    # throwaway Postgres on a docker network, require a green
    # /api/health?deep=true. Recipe proven one-off 2026-11-08 — see #96 and
    # docs/e2e.md. (The build logs a pre-existing informational
    # SecretsUsedInArgOrEnv warning on the Dockerfile's build-stage
    # AUTH_DISABLED — build-time dummy, not a secret; nothing to fix.)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # The harness script is stock Node — but pin 24 so every CI job runs
      # the same Node the image ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: docker/setup-buildx-action@v4
      # GHA layer cache, own scope (distinct from release.yml's per-arch
      # scopes): the deps layer only rebuilds when package-lock.json
      # changes. `load: true` puts the image in the local daemon for the
      # smoke step. Same-repo PRs can write the cache; forks read-only.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tackui:ci
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max
      # Build + boot the image and poll deep health; exits non-zero on any
      # failure (dumping the app container's logs first). Teardown is
      # idempotent on every exit path. This is the required gate — keep it
      # before the npm steps so a packaging failure skips that spend.
      - run: node e2e/image-smoke.mjs tackui:ci
      # Stretch (#96): the Tier 1 smoke suite against the containerized
      # app. The harness (e2e/web-server.mjs, E2E_APP_IMAGE mode) swaps
      # only the app-under-test — Postgres, migrations, seed, mock agent
      # and tests are identical. No local build here: the image IS the
      # artifact under test.
      #
      # Scoped to e2e/smoke.spec.ts (#101): this job is the packaging gate
      # — it certifies that the packaged artifact runs the Tier 1
      # journeys. Feature tiers (Tier 2+, e.g. e2e/chat.spec.ts) run in
      # standalone mode in the `e2e` job; they grow per area and would
      # only inflate this job's minutes without adding packaging signal.
      # See docs/e2e.md ("Packaging gate").
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:local -- e2e/smoke.spec.ts
        env:
          E2E_APP_IMAGE: tackui:ci
