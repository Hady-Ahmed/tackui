[project]
name = "agents-platform-os"
version = "0.1.0"
description = "Shared multi-tenant AgentOS hosting user-created agents (builder platform)."
requires-python = ">=3.12"
# Standalone project (imported into the tackui repo from the former
# agent-warehouse monorepo). The `agents_shared` package is vendored in
# this folder (auth.py only — the slice this service actually used from
# the old monorepo's shared/ package; the rest stayed behind with
# islamai/personal).
dependencies = [
    # Formerly provided by the workspace's agents-shared package; declared
    # directly now that this project stands alone.
    #
    # Versions are pinned to the exact resolution the agent-warehouse
    # workspace lock was tested against — this codebase moved repos
    # without a functional change, so it moves with its proven dependency
    # matrix rather than re-floating to whatever is newest.
    "fastapi==0.141.1",
    "pyjwt==2.14.0",
    "python-dotenv==1.2.3",
    # AG-UI protocol types (ag_ui.*) — formerly pulled in via the shared
    # package's dependency list; the dispatcher imports it directly.
    "ag-ui-protocol==1.0.0",
    # mcp extra: the dispatcher imports agno.tools.mcp lazily per run (a
    # core feature) — without the extra the MCP tooling resolves only
    # transitively and `uv sync` yields a broken MCP feature.
    "agno[mcp,tavily,website]==3.0.10",
    "openai==3.16.2",
    "sqlalchemy==2.0.54",
    # Postgres: psycopg3 everywhere — the catalog layer (catalog.py, with the
    # `pool` extra for its connection pool) AND agno's PostgresDb engine
    # (agno rewrites postgresql:// to the sqlalchemy postgresql+psycopg
    # dialect, which is psycopg3 — no psycopg2 anywhere).
    "psycopg[binary,pool]==3.3.6",
    # agno's PostgresDb can resolve the plain postgresql:// URL to the
    # legacy psycopg2 dialect on some paths (the catalog uses psycopg3).
    # In the old monorepo this arrived transitively via the sibling
    # agents' deps in the shared lock — declared explicitly here so the
    # dialect import always resolves.
    "psycopg2-binary==2.9.13",
    # Observability: env-driven Sentry init (SENTRY_DSN) — a no-op when the
    # DSN is unset (self-host deployments don't need it). The FastAPI
    # integration captures route-level exceptions with the request context.
    "sentry-sdk[fastapi]==2.73.0",
    # Keyless DuckDuckGo search. agno's DDG toolkit imports this
    # unconditionally, so it must be present.
    "ddgs==9.16.0",
]

# Virtual project: uv installs only the third-party dependencies into the
# venv; the source is used in place (flat imports — `from dispatcher
# import ...` — resolve from this directory, exactly as in the runtime
# image's WORKDIR below and the tests' sys.path setup).
[tool.uv]
package = false

[dependency-groups]
dev = [
    # Formerly in the agent-warehouse root manifest's shared dev group —
    # declared here now that this project stands alone. Pinned to the
    # warehouse lock's tested versions (see the note above).
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    # tests/test_platform_os.py imports fastmcp directly (live MCP server
    # fixture). agno's mcp extra brings it transitively; the dev dep pins
    # the import the tests actually make.
    "fastmcp==4.0.5",
    # tests/conftest.py boots a throwaway Postgres via testcontainers (the
    # agno db + catalog both need a real server now that sqlite is gone).
    "testcontainers[postgres]==4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
consider_namespace_packages = true
testpaths = ["tests"]
